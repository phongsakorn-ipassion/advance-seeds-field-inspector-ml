# Banana v4 YOLO26n-seg baseline training config.
#
# Source dataset:
# /Users/ppungpong/Downloads/Advance Seeds.v6-banana-v4.yolo26
#
# The processed dataset is expected under:
# data/processed/advance-seeds-banana-v4
#
# This is the conservative production-candidate baseline. Trial configs below
# should beat this profile before their settings are promoted.

model: yolo26n-seg.pt
data: configs/dataset.banana-v4.yaml
project: runs/banana-v4
name: banana-v4-baseline

epochs: 50
patience: 20
imgsz: 640
batch: auto
workers: auto
device: auto
seed: 42
deterministic: true
pretrained: true
cache: auto
amp: auto

optimizer: auto
lr0: 0.001
lrf: 0.0495
momentum: 0.947
weight_decay: 0.00064
warmup_epochs: 1.0
cos_lr: true
close_mosaic: 10

mosaic: 0.5
mixup: 0.0
copy_paste: 0.0
scale: 0.56
translate: 0.07
fliplr: 0.5
flipud: 0.0
degrees: 2.0
shear: 0.0
hsv_h: 0.014
hsv_s: 0.5
hsv_v: 0.4

mask_ratio: 4
overlap_mask: true
box: 7.5
cls: 0.5
multi_scale: 0.0

save: true
save_period: 10
plots: true
val: true
